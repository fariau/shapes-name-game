<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Shapes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #3b2a7a;
            --board: #fff;
            --sil: #ffffffcc;
            --dash: #fff;
            --sky1: #6fd0ff;
            --sky2: #d6f4ff;
            --s: min(16vw, 26vh);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --ink: #fff;
                --board: #2b2a6a;
                --sil: #ffffff26;
                --dash: #8f86e0;
                --sky1: #1b1b4b;
                --sky2: #2d2a7a;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --ink: #fff;
            --board: #2b2a6a;
            --sil: #ffffff26;
            --dash: #8f86e0;
            --sky1: #1b1b4b;
            --sky2: #2d2a7a;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        @supports(height:100dvh) {
            body {
                height: 100dvh
            }
        }

        body {
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            color: var(--ink);
            font-family: "Fredoka", system-ui, sans-serif;
            font-weight: 500;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 14% 20%, #fff 0 5vw, transparent 5.1vw), radial-gradient(circle at 90% 14%, #fff 0 4vw, transparent 4.1vw),
                radial-gradient(circle at 50% 118%, transparent 0 52%, #ff5d73 52% 55%, #ffa23a 55% 58%, #ffe14d 58% 61%, #58d36b 61% 64%, #4aa8ff 64% 67%, #9a6bff 67% 70%, transparent 70%),
                linear-gradient(var(--sky1), var(--sky2))
        }

        body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 16vh;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 18% 100%, #58d36b 0 58%, transparent 59%), radial-gradient(ellipse at 70% 100%, #3fbf5a 0 52%, transparent 53%), radial-gradient(ellipse at 100% 100%, #6be07d 0 40%, transparent 41%)
        }

        header,
        main {
            position: relative;
            z-index: 1
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            flex: 0 0 auto
        }

        h1 {
            margin: 0 auto 0 0;
            font-size: clamp(1.8rem, 5.4vh, 3rem);
            font-weight: 700;
            letter-spacing: .02em;
            -webkit-text-stroke: 7px #fff;
            paint-order: stroke fill;
            filter: drop-shadow(0 4px 0 rgba(59, 42, 122, .25))
        }

        button {
            font: inherit
        }

        button:focus-visible {
            outline: 4px solid #ffd23f;
            outline-offset: 3px
        }

        .btn {
            font-weight: 700;
            font-size: clamp(1rem, 2.8vh, 1.5rem);
            padding: .35em 1.3em;
            border-radius: 999px;
            border: 5px solid #fff;
            color: #fff;
            background: #ff6b6b;
            box-shadow: 0 6px 0 rgba(0, 0, 0, .22);
            cursor: pointer;
            transition: transform .1s, box-shadow .1s
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, .22)
        }

        .hud {
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 700;
            font-size: 1.5rem;
            background: #fffd;
            color: #3b2a7a;
            border-radius: 999px;
            padding: 4px 16px
        }

        .hud button {
            border: 0;
            background: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0
        }

        main {
            flex: 1 1 auto;
            min-height: 0;
            padding: 4px 24px 20px
        }

        section {
            height: 100%;
            display: grid;
            gap: 18px;
            grid-template-columns: 1fr
        }

        .board {
            background: linear-gradient(135deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .18));
            -webkit-backdrop-filter: blur(16px) saturate(1.5);
            backdrop-filter: blur(16px) saturate(1.5);
            border-radius: 44px;
            padding: 18px;
            border: 2px solid rgba(255, 255, 255, .85);
            box-shadow: 0 14px 40px rgba(59, 42, 122, .22), inset 0 2px 0 rgba(255, 255, 255, .9);
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4vh;
            text-align: center
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2vw;
            align-items: center
        }

        .slot,
        .cell {
            width: var(--s);
            height: var(--s);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative
        }

        .slot>svg {
            width: 100%;
            height: 100%;
            fill: var(--sil);
            stroke: var(--dash);
            stroke-width: 4;
            stroke-dasharray: 7 6;
            stroke-linejoin: round;
            transition: transform .15s;
            transform-origin: center
        }

        .slot.hot>svg {
            stroke: #ff8c1a;
            stroke-width: 6;
            fill: #ff8c1a44;
            transform: scale(1.12)
        }

        .slot.done>svg {
            opacity: 0
        }

        .piece {
            width: var(--s);
            height: var(--s);
            touch-action: none;
            cursor: grab;
            position: relative;
            user-select: none
        }

        .piece svg {
            width: 100%;
            height: 100%;
            display: block;
            stroke: #fff;
            stroke-width: 6;
            stroke-linejoin: round;
            filter: drop-shadow(0 6px 0 rgba(59, 42, 122, .28))
        }

        .piece:not(.drag) svg {
            animation: hop 2.2s ease-in-out infinite;
            animation-delay: var(--d, 0s)
        }

        .slot .piece svg {
            animation: none
        }

        .piece.drag {
            z-index: 50;
            cursor: grabbing
        }

        .piece.drag svg {
            transform: scale(1.2) rotate(-6deg)
        }

        .piece b {
            position: absolute;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
            margin-top: 8px;
            white-space: nowrap;
            pointer-events: none;
            font-size: clamp(1.1rem, 3.4vh, 2rem);
            font-weight: 700;
            color: #fff;
            -webkit-text-stroke: 7px #3b2a7a;
            paint-order: stroke fill;
            letter-spacing: .03em
        }

        .slot .piece {
            position: absolute;
            pointer-events: none
        }

        .slot.pop .piece {
            animation: pop .5s
        }

        @keyframes hop {
            50% {
                transform: translateY(-9px)
            }
        }

        @keyframes pop {
            40% {
                transform: scale(1.3) rotate(8deg)
            }
        }

        @keyframes blink {

            0%,
            92%,
            100% {
                transform: scaleY(1)
            }

            96% {
                transform: scaleY(.1)
            }
        }

        .eyes {
            animation: blink 4s infinite;
            transform-box: fill-box;
            transform-origin: center
        }

        .m2 {
            display: none
        }

        .slot.done .m1,
        .piece.drag .m1 {
            display: none
        }

        .slot.done .m2,
        .piece.drag .m2 {
            display: block
        }

        #slots {
            padding-bottom: 5vh
        }

        .tray {
            border-top: 5px dotted var(--dash);
            padding-top: 4vh;
            width: 100%
        }

        .bubble {
            position: relative;
            background: #fff;
            color: #3b2a7a;
            border-radius: 30px;
            padding: 12px 20px;
            font-weight: 700;
            font-size: clamp(1rem, 2.8vh, 1.5rem);
            box-shadow: 0 5px 0 rgba(59, 42, 122, .18);
            margin: 0;
            max-width: 100%
        }

        .bubble::before {
            content: "";
            position: absolute;
            top: -14px;
            left: 50%;
            margin-left: -14px;
            border: 14px solid transparent;
            border-top: 0;
            border-bottom-color: #fff
        }

        #mascot {
            font-size: min(9vw, 16vh);
            line-height: 1;
            animation: hop 2.4s ease-in-out infinite
        }

        #round {
            margin: 0;
            font-weight: 700;
            font-size: clamp(1.2rem, 3.6vh, 2rem)
        }

        #prog {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: min(2.8vw, 5.5vh)
        }

        #prog span {
            filter: grayscale(1);
            opacity: .3;
            transition: .3s
        }

        #prog span.on {
            filter: none;
            opacity: 1;
            animation: pop .5s
        }

        #win {
            position: fixed;
            inset: 0;
            background: #3b2a7a99;
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center
        }

        #win[hidden] {
            display: none
        }

        .winbox {
            background: #fff;
            color: #3b2a7a;
            border-radius: 50px;
            border: 8px solid #ffd23f;
            padding: 4vh 6vw;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2vh;
            align-items: center;
            animation: pop .6s
        }

        .winbox h2 {
            margin: 0;
            font-size: clamp(2rem, 8vh, 4rem)
        }

        .trophy {
            font-size: min(14vw, 22vh);
            line-height: 1;
            animation: hop 1.2s infinite
        }

        #cap {
            position: fixed;
            left: 50%;
            top: 1.2vh;
            transform: translate(-50%, -12px) scale(.9);
            z-index: 120;
            background: #fff;
            color: #3b2a7a;
            font-weight: 700;
            font-size: clamp(1.1rem, 3.6vh, 2.2rem);
            padding: .25em .9em;
            border-radius: 999px;
            box-shadow: 0 5px 0 rgba(59, 42, 122, .25);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .25s;
            white-space: nowrap
        }

        #cap.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1)
        }

        #cv {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 200
        }

        @media(orientation:portrait) {
            :root {
                --s: min(32vw, 14.5vh)
            }

            #slots {
                padding-bottom: 2vh
            }

            .row {
                display: grid;
                grid-template-columns: repeat(2, var(--s));
                justify-content: center;
                gap: 5vh 8vw
            }

            .board {
                gap: 3vh;
                padding: 12px
            }

            .tray {
                padding-top: 3vh
            }

            #cap {
                top: 8.6vh
            }
        }

        @media(min-width:2200px) {
            h1 {
                font-size: 4.5rem
            }

            .hud,
            .hud button {
                font-size: 2.2rem
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                animation: none !important
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 id="title" aria-label="Shapes"></h1>
        <div class="hud"><button id="snd" aria-pressed="true" aria-label="Sound on or off">🔊</button></div>
    </header>
    <main>
        <section>
            <div class="board" style="overflow:visible">
                <div class="row" id="slots"></div>
                <div class="row tray" id="tray"></div>
            </div>
        </section>
    </main>
    <div id="win" hidden>
        <div class="winbox">
            <div class="trophy">🏆</div>
            <h2>Hooray!</h2><button class="btn" id="again">Next ▶</button>
        </div>
    </div>
    <div id="cap" role="status" aria-live="polite"></div>
    <canvas id="cv"></canvas>
    <script>
        const $ = id => document.getElementById(id);
        const S = {
            circle: '<circle cx="50" cy="50" r="40"/>',
            square: '<rect x="10" y="10" width="80" height="80" rx="10"/>',
            rectangle: '<rect x="5" y="24" width="90" height="52" rx="9"/>',
            triangle: '<polygon points="50,10 92,86 8,86"/>',
            star: '<polygon points="50,8 61,38 93,38 67,57 77,89 50,70 23,89 33,57 7,38 39,38"/>',
            heart: '<path d="M50 88C10 58 6 30 26 20C40 14 50 24 50 32C50 24 60 14 74 20C94 30 90 58 50 88Z"/>',
            diamond: '<polygon points="50,6 90,50 50,94 10,50"/>',
            hexagon: '<polygon points="50,7 88,28 88,72 50,93 12,72 12,28"/>',
            octagon: '<polygon points="35,8 65,8 92,35 92,65 65,92 35,92 8,65 8,35"/>',
            oval: '<ellipse cx="50" cy="50" rx="42" ry="30"/>',
            pentagon: '<polygon points="50,8 93,40 77,90 23,90 7,40"/>',
            cross: '<polygon points="35,8 65,8 65,35 92,35 92,65 65,65 65,92 35,92 35,65 8,65 8,35 35,35"/>',
            drop: '<path d="M50 6C50 6 20 42 20 62A30 30 0 0 0 80 62C80 42 50 6 50 6Z"/>'
        };
        const C = {circle: '#ff5d73', square: '#4aa8ff', rectangle: '#ffb74d', triangle: '#58d36b', star: '#ffcc33', heart: '#ff8fc7', diamond: '#9a6bff', hexagon: '#ffa23a', octagon: '#ff6f61', oval: '#22c7d6', pentagon: '#c8d33a', cross: '#3dd6a3', drop: '#4fc3f7'};
        const FY = {triangle: 12, star: 4, heart: -2, drop: 10};
        const face = (dy = 0) => `<g transform="translate(0 ${dy})"><g class="eyes" stroke="none"><circle cx="37" cy="45" r="8" fill="#fff"/><circle cx="63" cy="45" r="8" fill="#fff"/><circle cx="39" cy="46" r="4" fill="#222"/><circle cx="65" cy="46" r="4" fill="#222"/></g><path class="m1" d="M40 62Q50 73 60 62" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><path class="m2" d="M38 60Q50 84 62 60Z" fill="#8a1a3a" stroke="#222" stroke-width="3" stroke-linejoin="round"/></g>`;
        const svg = (n, fill) => `<svg viewBox="0 0 100 100"${fill ? ` fill="${fill}"` : ''}>${S[n]}${fill ? face(FY[n] || 0) : ''}</svg>`;
        const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
        const rnd = a => a[Math.floor(Math.random() * a.length)];
        const N = 4; let score = 0, placed = 0, round = 0, snd = true, AC; const hist = [];

        'Shapes'.split('').forEach((ch, i) => {const s = document.createElement('span'); s.textContent = ch; s.style.color = ['#ff5d73', '#ffa23a', '#ffcc33', '#58d36b', '#4aa8ff', '#9a6bff'][i % 6]; $('title').append(s)});

        /* sound + voice */
        function tone(f, d = .18, type = 'sine', v = .14, w = 0) {
            if (!snd) return;
            try {
                AC = AC || new (window.AudioContext || window.webkitAudioContext)();
                const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + w;
                o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
                o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d)
            } catch (e) { }
        }
        let VOICE = null;
        function pickVoice() {
            try {
                const list = speechSynthesis.getVoices().filter(x => /^en/i.test(x.lang)); if (!list.length) return;
                const score = x => {
                    const n = x.name; let s = 0;
                    if (/natural|neural|online/i.test(n)) s += 10;
                    if (/premium|enhanced/i.test(n)) s += 8;
                    if (/Google US English|Google UK English Female/i.test(n)) s += 6;
                    if (/Aria|Jenny|Samantha|Ava|Allison|Zira|Karen|Serena|Moira|Tessa|Libby|Sonia/i.test(n)) s += 5;
                    if (/en[-_]US/i.test(x.lang)) s += 2;
                    if (x.localService === false) s += 1;
                    if (/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Princess/i.test(n)) s -= 20;
                    return s
                };
                VOICE = list.sort((a, b) => score(b) - score(a))[0];
            } catch (e) { }
        }
        if (window.speechSynthesis) {pickVoice(); speechSynthesis.onvoiceschanged = pickVoice}
        let capT;
        function caption(t) {
            const c = $('cap'); c.textContent = '💬 ' + t[0].toUpperCase() + t.slice(1); c.classList.add('show');
            clearTimeout(capT); capT = setTimeout(() => c.classList.remove('show'), 2200);
        }
        function say(t) {
            caption(t);
            if (!snd || !window.speechSynthesis) return;
            try {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(t);
                if (VOICE) {u.voice = VOICE; u.lang = VOICE.lang} else u.lang = 'en-US';
                u.rate = .85; u.pitch = 1.05; u.volume = 1;
                speechSynthesis.speak(u);
            } catch (e) { }
        }
        const NOTES = [523, 587, 659, 698, 784, 880, 988, 1047];
        $('snd').onclick = () => {snd = !snd; $('snd').textContent = snd ? '🔊' : '🔇'; $('snd').setAttribute('aria-pressed', snd); if (!snd) try {speechSynthesis.cancel()} catch (e) { } };

        /* confetti */
        const cv = $('cv'), cx = cv.getContext('2d'); let ps = [], raf = 0;
        function fit() {cv.width = innerWidth; cv.height = innerHeight} fit(); addEventListener('resize', fit);
        function burst(x, y, n = 30, cols = ['#ff5d73', '#ffcc33', '#4aa8ff', '#58d36b', '#ffa23a', '#9a6bff']) {
            for (let i = 0; i < n; i++) {
                const a = Math.random() * 6.28, v = 3 + Math.random() * 7;
                ps.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, r: 5 + Math.random() * 6, c: cols[i % cols.length], l: 60 + Math.random() * 30})
            }
            if (!raf) raf = requestAnimationFrame(loop);
        }
        function loop() {
            cx.clearRect(0, 0, cv.width, cv.height); ps = ps.filter(p => p.l-- > 0);
            ps.forEach(p => {p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; cx.globalAlpha = Math.min(1, p.l / 30); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.r, p.r * 1.6)});
            raf = ps.length ? requestAnimationFrame(loop) : 0;
            if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
        }
        const hud = () => { };

        /* a shape can come back only after 2 other rounds have passed */
        function nextSet() {
            const recent = new Set(hist.slice(-2).flat());
            const set = shuffle(Object.keys(S).filter(n => !recent.has(n))).slice(0, N);
            hist.push(set); return set;
        }
        function build() {
            placed = 0; $('win').hidden = true;
            $('slots').innerHTML = ''; $('tray').innerHTML = '';
            const set = nextSet();
            shuffle(set).forEach(n => {const d = document.createElement('div'); d.className = 'slot'; d.dataset.n = n; d.innerHTML = svg(n); $('slots').append(d)});
            shuffle(set).forEach(n => {
                const c = document.createElement('div'); c.className = 'cell';
                const p = document.createElement('div'); p.className = 'piece'; p.dataset.n = n; p.style.setProperty('--d', (-Math.random() * 2).toFixed(2) + 's'); p.innerHTML = svg(n, C[n]) + `<b>${n[0].toUpperCase() + n.slice(1)}</b>`;
                drag(p); c.append(p); $('tray').append(c);
            });
        }
        function slotAt(p) {
            const r = p.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
            return [...document.querySelectorAll('.slot')].find(s => {const b = s.getBoundingClientRect(); return x > b.left && x < b.right && y > b.top && y < b.bottom});
        }
        function drag(p) {
            let sx, sy, on = false;
            p.onpointerdown = e => {
                on = true; sx = e.clientX; sy = e.clientY; p.setPointerCapture(e.pointerId); p.classList.add('drag'); p.style.transition = 'none';
                tone(660, .08, 'triangle'); say(p.dataset.n);
            };
            p.onpointermove = e => {
                if (!on) return; p.style.transform = `translate(${e.clientX - sx}px,${e.clientY - sy}px)`;
                const s = slotAt(p); document.querySelectorAll('.slot').forEach(x => x.classList.toggle('hot', x === s && !x.classList.contains('done')));
            };
            p.onpointerup = p.onpointercancel = e => {
                if (!on) return; on = false; p.classList.remove('drag');
                document.querySelectorAll('.slot').forEach(x => x.classList.remove('hot'));
                const s = slotAt(p);
                if (s && s.dataset.n === p.dataset.n && !s.classList.contains('done')) {
                    const r = s.getBoundingClientRect();
                    s.append(p); s.classList.add('done', 'pop'); p.style.transform = ''; p.style.transition = '';
                    placed++; score += 10; hud();
                    tone(NOTES[Math.min(placed - 1, 7)], .25, 'triangle', .2);
                    burst(r.left + r.width / 2, r.top + r.height / 2, 20, [C[p.dataset.n], '#fff', '#ffd23f']);
                    if (placed === N) win(); else say(rnd(['Yay!', 'Great job!', 'Super!', 'Wow!']))
                } else {
                    p.style.transition = 'transform .25s'; p.style.transform = '';
                    if (s) {tone(180, .25, 'square', .08); say('Try again')}
                }
            };
        }
        function win() {
            score += N * 5; hud(); say('Hooray! You did it!');
            [0, 2, 4, 7].forEach((k, i) => tone(NOTES[k], .3, 'triangle', .2, i * .12));
            setTimeout(() => {$('win').hidden = false; $('again').focus()}, 700);
            for (let i = 0; i < 5; i++)setTimeout(() => burst(innerWidth * (.15 + Math.random() * .7), innerHeight * (.2 + Math.random() * .3), 45), i * 180);
        }
        $('again').onclick = build;
        build(); hud();
    </script>
</body>

</html>
